<!-- ==================== PARENT TO CHILD ==================== -->

<h1 class="text-2xl font-bold uppercase italic text-amber-900">Parent to Child Data Passing</h1>

<!-- Parent Component -->
<app-a></app-a>

<br />
<br />

<!-- ==================== CHILD TO PARENT ==================== -->

<h1 class="text-2xl font-bold uppercase italic text-amber-900">Child to Parent Data Passing</h1>

<!-- Child Component -->

<!--
  (getUsers)="handleUsers($event)"

  getUsers  → Event emitted from Child
  $event    → Data received from Child
  handleUsers() → Parent method that receives the data
-->
<app-child (getUsers)="handleUsers($event)"></app-child>

<!-- Print direct array of users -->
<p>
  <!-- {{ users }} -->
</p>

<br />

<!-- Print all users -->
@for (user of users; track user) {
  <p>{{ user }}</p>
}
